<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 220" role="img" aria-label="Data pipeline architecture: ingest, transform, warehouse, analytics">
 <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B162B"/><stop offset="1" stop-color="#11233C"/></linearGradient><linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#40D7CA"/><stop offset="1" stop-color="#79A9FF"/></linearGradient></defs>
 <rect x="1" y="1" width="1038" height="218" rx="20" fill="url(#b)" stroke="#304B67"/>
 <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
  <text x="520" y="34" font-size="12" letter-spacing="3" fill="#8CA8C8">FROM RAW DATA TO DECISION-READY INSIGHTS</text>
  <g stroke="#50789C" stroke-width="1.5">
   <rect x="28" y="66" width="185" height="116" rx="13" fill="#152D44"/>
   <rect x="288" y="66" width="185" height="116" rx="13" fill="#15364C"/>
   <rect x="548" y="66" width="185" height="116" rx="13" fill="#142F49"/>
   <rect x="808" y="66" width="205" height="116" rx="13" fill="#172E4B"/>
  </g>
  <g font-size="18" fill="#E7F2FF" font-weight="700"><text x="120" y="104">INGEST</text><text x="380" y="104">TRANSFORM</text><text x="640" y="104">MODEL</text><text x="910" y="104">ANALYZE</text></g>
  <g font-size="13" fill="#A4C6D7"><text x="120" y="134">Files / APIs / Raw</text><text x="380" y="134">Python / Pandas</text><text x="640" y="134">PostgreSQL / SQL</text><text x="910" y="134">Power BI / KPIs</text></g>
  <g font-size="11" fill="#73D6CD"><text x="120" y="160">SOURCE</text><text x="380" y="160">VALIDATE + CLEAN</text><text x="640" y="160">WAREHOUSE / MART</text><text x="910" y="160">DECISIONS</text></g>
 </g>
