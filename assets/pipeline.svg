 <g fill="#77E1DD"><circle cx="251" cy="124" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="1.1s" repeatCount="indefinite"/></circle><circle cx="511" cy="124" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="1.1s" begin=".3s" repeatCount="indefinite"/></circle><circle cx="771" cy="124" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="1.1s" begin=".6s" repeatCount="indefinite"/></circle></g>
